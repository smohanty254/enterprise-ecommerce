name: Deploy Enterprise Ecommerce to Amazon ECS

on:
  push:
    branches:
      - main
      - master

    tags:
      - 'v*.*.*'

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

  ####################################################
  # Backend
  ####################################################
  BACKEND_IMAGE: ${{ vars.BACKEND_IMAGE }}
  BACKEND_CLUSTER: ${{ vars.BACKEND_CLUSTER }}
  BACKEND_SERVICE: ${{ vars.BACKEND_SERVICE }}
  BACKEND_TASK_DEFINITION: backend-taskdef.json
  BACKEND_CONTAINER_NAME: backend

  ####################################################
  # Frontend
  ####################################################
  FRONTEND_IMAGE: ${{ vars.FRONTEND_IMAGE }}
  FRONTEND_CLUSTER: ${{ vars.FRONTEND_CLUSTER }}
  FRONTEND_SERVICE: ${{ vars.FRONTEND_SERVICE }}
  FRONTEND_TASK_DEFINITION: frontend-task.json
  FRONTEND_CONTAINER_NAME: frontend

jobs:
  deploy:
    name: Build Push Deploy

    runs-on: ubuntu-latest

    timeout-minutes: 40

    steps:
      ####################################################
      # Checkout
      ####################################################

      - name: Checkout repository
        uses: actions/checkout@v4

      ####################################################
      # Configure AWS
      ####################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      ####################################################
      # Login ECR
      ####################################################

      - name: Login to Amazon ECR
        id: login-ecr

        uses: aws-actions/amazon-ecr-login@v2

      ####################################################
      # Backend Build
      ####################################################

      - name: Build Backend Image

        id: backend-image

        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |

          echo "Building Backend..."

          docker build \
            -f backend/Dockerfile \
            -t $ECR_REGISTRY/${{ env.BACKEND_IMAGE }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/${{ env.BACKEND_IMAGE }}:latest \
            ./backend

          echo "Pushing Backend..."

          docker push $ECR_REGISTRY/${{ env.BACKEND_IMAGE }}:$IMAGE_TAG

          docker push $ECR_REGISTRY/${{ env.BACKEND_IMAGE }}:latest

          echo "image=$ECR_REGISTRY/${{ env.BACKEND_IMAGE }}:$IMAGE_TAG" >> $GITHUB_OUTPUT

      ####################################################
      # Backend Task Definition
      ####################################################

      - name: Render Backend Task Definition
        id: backend-task

        uses: aws-actions/amazon-ecs-render-task-definition@v1

        with:
          task-definition: ${{ env.BACKEND_TASK_DEFINITION }}
          container-name: ${{ env.BACKEND_CONTAINER_NAME }}
          image: ${{ steps.backend-image.outputs.image }}

      ####################################################
      # Deploy Backend
      ####################################################

      - name: Deploy Backend to ECS

        uses: aws-actions/amazon-ecs-deploy-task-definition@v2

        with:
          task-definition: ${{ steps.backend-task.outputs.task-definition }}
          service: ${{ env.BACKEND_SERVICE }}
          cluster: ${{ env.BACKEND_CLUSTER }}
          wait-for-service-stability: true

      ####################################################
      # Frontend Build
      ####################################################

      - name: Build Frontend Image

        id: frontend-image

        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |

          echo "Building Frontend..."

          docker build \
            -f frontend/Dockerfile \
            -t $ECR_REGISTRY/${{ env.FRONTEND_IMAGE }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/${{ env.FRONTEND_IMAGE }}:latest \
            ./frontend

          echo "Pushing Frontend..."

          docker push \
            $ECR_REGISTRY/${{ env.FRONTEND_IMAGE }}:$IMAGE_TAG

          docker push \
            $ECR_REGISTRY/${{ env.FRONTEND_IMAGE }}:latest

          echo "image=$ECR_REGISTRY/${{ env.FRONTEND_IMAGE }}:$IMAGE_TAG" >> $GITHUB_OUTPUT    

            ####################################################
      # Frontend Task Definition
      ####################################################

      - name: Render Frontend Task Definition
        id: frontend-task

        uses: aws-actions/amazon-ecs-render-task-definition@v1

        with:
          task-definition: ${{ env.FRONTEND_TASK_DEFINITION }}
          container-name: ${{ env.FRONTEND_CONTAINER_NAME }}
          image: ${{ steps.frontend-image.outputs.image }}

      ####################################################
      # Deploy Frontend
      ####################################################

      - name: Deploy Frontend to ECS

        uses: aws-actions/amazon-ecs-deploy-task-definition@v2

        with:
          task-definition: ${{ steps.frontend-task.outputs.task-definition }}
          service: ${{ env.FRONTEND_SERVICE }}
          cluster: ${{ env.FRONTEND_CLUSTER }}
          wait-for-service-stability: true

      ####################################################
      # Verify Deployment
      ####################################################

      - name: Verify Backend Service

        run: |
          aws ecs describe-services \
            --cluster ${{ env.BACKEND_CLUSTER }} \
            --services ${{ env.BACKEND_SERVICE }}

      - name: Verify Frontend Service

        run: |
          aws ecs describe-services \
            --cluster ${{ env.FRONTEND_CLUSTER }} \
            --services ${{ env.FRONTEND_SERVICE }}

      ####################################################
      # Deployment Summary
      ####################################################

      - name: Deployment Summary

        run: |
          echo ""
          echo "========================================"
          echo " ECS Deployment Completed Successfully"
          echo "========================================"
          echo ""
          echo "Backend Cluster : ${{ env.BACKEND_CLUSTER }}"
          echo "Backend Service : ${{ env.BACKEND_SERVICE }}"
          echo ""
          echo "Frontend Cluster : ${{ env.FRONTEND_CLUSTER }}"
          echo "Frontend Service : ${{ env.FRONTEND_SERVICE }}"
          echo ""
          echo "Backend Image"
          echo "${{ steps.backend-image.outputs.image }}"
          echo ""
          echo "Frontend Image"
          echo "${{ steps.frontend-image.outputs.image }}"
          echo ""
          echo "Commit SHA"
          echo "${{ github.sha }}"
          echo ""

      ####################################################
      # GitHub Actions Summary
      ####################################################

      - name: Publish Deployment Summary
        if: always()
        run: |
          {
            echo "## 🚀 Amazon ECS Deployment Summary"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Workflow | ${{ github.workflow }} |"
            echo "| Repository | ${{ github.repository }} |"
            echo "| Branch | ${{ github.ref_name }} |"
            echo "| Commit | ${{ github.sha }} |"
            echo "| Actor | ${{ github.actor }} |"
            echo "| AWS Region | ${{ env.AWS_REGION }} |"
            echo ""
            echo "### Backend"
            echo ""
            echo "- Cluster: ${{ env.BACKEND_CLUSTER }}"
            echo "- Service: ${{ env.BACKEND_SERVICE }}"
            echo "- Image: ${{ steps.backend-image.outputs.image }}"
            echo ""
            echo "### Frontend"
            echo ""
            echo "- Cluster: ${{ env.FRONTEND_CLUSTER }}"
            echo "- Service: ${{ env.FRONTEND_SERVICE }}"
            echo "- Image: ${{ steps.frontend-image.outputs.image }}"
            echo ""
            echo "Deployment completed successfully."
          } >> $GITHUB_STEP_SUMMARY

      ####################################################
      # Success
      ####################################################

      - name: Success
        if: success()
        run: |
          echo "====================================="
          echo "Deployment Successful"
          echo "====================================="

      ####################################################
      # Failure
      ####################################################

      - name: Failure
        if: failure()
        run: |
          echo "====================================="
          echo "Deployment Failed"
          echo "====================================="
          exit 1
